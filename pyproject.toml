[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "messqry-ai"
version = "0.1.0"
description = "A foundation for a dependable MLOps platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2.0",
    "anyio>=4.14.2,<5.0",
    "fastapi>=0.115,<1.0",
    "packaging>=24,<27",
    "PyJWT[crypto]>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "PyYAML>=6.0.2,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.40,<2.0"]
postgres = ["psycopg[binary]>=3.2,<4.0"]
runtime = ["boto3>=1.40,<2.0", "mlflow==3.17.0"]
dev = [
    "pip-audit>=2.10.1,<3.0",
    "pytest>=9.0.3,<10.0",
    "ruff>=0.15,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
where = ["src"]
